server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # nginx corre como usuario no-root: los temporales van a /tmp, que es
  # escribible por appuser (si no, falla al arrancar o al recargar).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Reverse proxy de la API dentro de la red de compose: mismo origen para la
  # PWA (el backend no tiene CORS). `proxy_pass` sin URI preserva el path tal
  # cual (evita el doble /api) y no hay proxy_cache: el Service Worker ya
  # cachea con NetworkFirst/NetworkOnly su propio runtimeCaching.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: todo lo que no sea archivo cae en index.html (Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
