server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # nginx corre como usuario no-root: los temporales van a /tmp, que es
  # escribible por appuser (si no, falla al arrancar o al recargar).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # SPA: todo lo que no sea archivo cae en index.html (Router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
