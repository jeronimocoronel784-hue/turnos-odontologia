[project]
name = "turnos-odontologia"
version = "0.1.0"
description = "SaaS multi-tenant de turnos para consultorios odontológicos (piloto local-first)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "email-validator>=2.0",
  "redis>=5.0",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["../../tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# `app` y `alembic` son first-party explícitos: tras la mudanza a src/backend/
# la detección automática de ruff varía según cwd/config-discovery y los
# reclasificaba como third-party (I001 en alembic/* y tests/*). Fijarlos
# preserva el orden de imports del archive sin tocar código.
known-first-party = ["app", "alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []

[tool.alembic]
script_location = "alembic"
